<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contract Guard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #1a1a2e; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-bottom: 24px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; max-width: 640px; }
    pre { background: #f5f5f7; padding: 12px; border-radius: 6px; overflow-x: auto; }
    .placeholder { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>Contract Guard</h1>
  <p class="sub">API contract registry &amp; breaking-change detection</p>
  <div class="card">
    <h2>Health</h2>
    <pre id="health">loading…</pre>
    <p class="placeholder">Phase 1 scaffold. Publishing workflow, findings and audit
    pages arrive with the pipeline modules.</p>
  </div>
  <script>
    fetch('/api/health').then(r => r.json())
      .then(j => { document.getElementById('health').textContent = JSON.stringify(j, null, 2); })
      .catch(e => { document.getElementById('health').textContent = 'health check failed: ' + e; });
  </script>
</body>
</html>
